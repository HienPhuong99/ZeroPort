# Builds the desktop app. Tags (v*) also publish a GitHub Release with the installers.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: --win --x64 }
          - { os: macos-latest, args: --mac --arm64 }      # Apple Silicon
          - { os: macos-15-intel, args: --mac --x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - if: runner.os == 'macOS'
        run: codesign -dv --verbose=2 release/mac*/ZeroPort.app
      - uses: actions/upload-artifact@v4
        with:
          name: zeroport-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci --ignore-scripts
      - run: npx vite build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: mkdir -p release && cp android/app/build/outputs/apk/debug/app-debug.apk release/ZeroPort-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zeroport-android
          path: release/ZeroPort-android.apk
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/ZeroPort-android.apk
